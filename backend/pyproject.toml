[project]
name = "margin-bookstore-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "structlog>=26.1,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.13.1,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel.scripts]
build = "python -m scripts.deploy_setup"
